name: CI

on:
  push:
    branches: [main, refactor/foundation, refactor/java-desktop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew clean build
      - name: Verify standalone JAR
        run: java -jar build/libs/umlvisualizer-all.jar --help
